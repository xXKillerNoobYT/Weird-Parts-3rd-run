# This file configures the analyzer for the Flutter app under `app/`.
# Run: `flutter analyze` from `app/`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
  errors:
    # Drift / code-gen annotations on fields that the analyzer otherwise flags.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    prefer_single_quotes: true
    unawaited_futures: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    unnecessary_lambdas: true
    use_key_in_widget_constructors: true
    # Soft-delete / sync paths should stay explicit.
    cancel_subscriptions: true
    close_sinks: true
